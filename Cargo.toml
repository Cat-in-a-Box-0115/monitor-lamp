[package]
name = "detent"
version = "3.0.0"
edition = "2021"
description = "Desk companion: Yeelight Screen Light Bar control and the knob's PC link"

[lib]
name = "detent"
path = "src/lib.rs"

[[bin]]
name = "detent"
path = "src/main.rs"

[dependencies]
# Software renderer only: the GPU renderers pull in graphics drivers that
# cost ~150 MB of memory for a window this simple.
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
hex = "0.4"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Screen sync capture (DXGI desktop duplication, downscaled on the GPU)
[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
